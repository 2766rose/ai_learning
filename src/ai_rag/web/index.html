<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能知识库助手</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-2: #6366f1;
    --accent-soft: #eef2ff;
    --bg: #f6f7fb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-sub: #6b7280;
    --text-3: #9ca3af;
    --green: #10b981;
    --red: #ef4444;
    --amber: #f59e0b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* ============ 顶部导航 ============ */
  .topbar {
    height: 60px;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 22px;
    gap: 14px;
    position: relative;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: grid; place-items: center; color: #fff; font-size: 18px;
    box-shadow: 0 4px 12px rgba(99,102,241,.35);
  }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .brand-sub { font-size: 11.5px; color: var(--text-3); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-sub);
    background: var(--card); border: 1px solid var(--border);
    padding: 5px 11px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--red); }

  /* ============ 布局 ============ */
  .layout { display: flex; height: calc(100vh - 60px); }

  /* ============ 左侧栏 ============ */
  .sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 18px 16px;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  .sec-title {
    font-size: 12px; font-weight: 600; color: var(--text-3);
    letter-spacing: .6px; margin: 14px 2px 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .sec-title:first-child { margin-top: 0; }

  /* ---- 上传区（美化重点）---- */
  .dropzone {
    border: 1.6px dashed #c7c9d9;
    border-radius: 16px;
    background: linear-gradient(180deg, #fafbff, #f4f5ff);
    padding: 26px 14px;
    text-align: center;
    cursor: pointer;
    transition: all .18s ease;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: linear-gradient(180deg, #eef2ff, #e4e8ff);
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(79,70,229,.12);
  }
  .dz-icon {
    width: 52px; height: 52px; margin: 0 auto 12px;
    border-radius: 16px;
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
    display: grid; place-items: center;
    color: var(--accent); font-size: 24px;
    transition: transform .18s ease;
  }
  .dropzone:hover .dz-icon { transform: scale(1.06); }
  .dz-t1 { font-size: 14px; font-weight: 600; color: var(--text); }
  .dz-t2 { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .dz-types { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .dz-type {
    font-size: 11px; color: var(--accent);
    background: #fff; border: 1px solid #dbe1ff;
    padding: 3px 9px; border-radius: 999px;
  }

  .up-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .up-item {
    display: flex; align-items: center; gap: 10px;
    background: #f9fafb; border: 1px solid #eef0f4;
    border-radius: 12px; padding: 9px 11px;
  }
  .up-file-icon {
    width: 34px; height: 34px; flex-shrink: 0;
    border-radius: 9px; display: grid; place-items: center;
    background: #eef2ff; color: var(--accent); font-size: 15px;
  }
  .up-body { flex: 1; min-width: 0; }
  .up-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-st { font-size: 11px; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .st-ok { color: var(--green); } .st-err { color: var(--red); } .st-busy { color: var(--amber); }
  .spinner {
    width: 11px; height: 11px; border: 2px solid rgba(245,158,11,.25);
    border-top-color: var(--amber); border-radius: 50%;
    animation: rot .8s linear infinite; display: inline-block;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid #f0f0f4; font-size: 11.5px; color: var(--text-3); display: flex; flex-direction: column; gap: 6px; }

  /* ============ 主聊天区 ============ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-scroll { flex: 1; overflow-y: auto; }
  .chat-inner { max-width: 780px; margin: 0 auto; padding: 26px 22px 10px; display: flex; flex-direction: column; gap: 4px; }

  .welcome { text-align: center; padding: 8vh 0 4vh; animation: fadeUp .4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .welcome .orb {
    width: 66px; height: 66px; margin: 0 auto 18px; border-radius: 22px;
    background: conic-gradient(from 180deg, #6366f1, #a855f7, #6366f1);
    display: grid; place-items: center; font-size: 30px; color: #fff;
    box-shadow: 0 16px 40px rgba(99,102,241,.4);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .welcome h2 { font-size: 22px; font-weight: 700; }
  .welcome p { color: var(--text-sub); font-size: 13.5px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 22px; max-width: 600px; margin-left: auto; margin-right: auto; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    font-size: 13px; padding: 8px 15px; border-radius: 999px; cursor: pointer;
    transition: all .16s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,.1); }

  .msg { display: flex; gap: 11px; padding: 14px 0; animation: fadeUp .22s ease; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px;
    display: grid; place-items: center; font-size: 16px;
  }
  .msg.user .avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 3px 10px rgba(99,102,241,.3); }
  .msg.ai .avatar { background: linear-gradient(135deg, #34d399, #10b981); box-shadow: 0 3px 10px rgba(16,185,129,.25); }
  .bubble { max-width: 78%; padding: 11px 15px; border-radius: 16px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble {
    background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 4px 14px rgba(99,102,241,.28);
  }
  .msg.ai .bubble {
    background: #fff; border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); margin-left: 3px; vertical-align: text-bottom; border-radius: 1px; animation: blink .8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ 输入区 ============ */
  .composer-wrap { padding: 12px 22px 20px; }
  .composer-inner { max-width: 780px; margin: 0 auto; }
  .composer {
    background: #fff; border: 1px solid var(--border); border-radius: 18px;
    padding: 10px 12px; display: flex; align-items: flex-end; gap: 10px;
    box-shadow: 0 6px 24px rgba(17,24,39,.07);
    transition: border-color .18s, box-shadow .18s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 8px 30px rgba(79,70,229,.16); }
  .composer textarea {
    flex: 1; border: none; outline: none; resize: none; font-size: 14.5px; font-family: inherit;
    line-height: 1.55; max-height: 130px; min-height: 26px; padding: 7px 4px; background: transparent;
  }
  .icon-btn {
    width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px;
    border: 1px solid var(--border); background: #fff; color: var(--text-sub);
    font-size: 17px; cursor: pointer; display: grid; place-items: center;
    transition: all .16s ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .send-btn {
    border: none; border-radius: 12px; height: 38px; padding: 0 20px;
    background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(79,70,229,.35);
    transition: all .16s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,.45); }
  .send-btn:disabled { opacity: .55; transform: none; cursor: not-allowed; }
  .composer-hint { text-align: center; font-size: 11px; color: var(--text-3); margin-top: 9px; }
</style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">🤖</div>
    <div>
      <div class="brand-name">智能知识库助手</div>
      <div class="brand-sub">RAG · 混合检索 · Agent</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="status-pill"><span class="dot" id="healthDot"></span><span id="healthText">连接中…</span></span>
    <span class="status-pill">🛠 <span id="toolsText">加载中…</span></span>
  </div>
</div>

<div class="layout">
  <!-- 左侧：知识库 / 上传 -->
  <aside class="sidebar">
    <div class="sec-title">📚 知识库</div>
    <div class="dropzone" id="drop">
      <div class="dz-icon">📤</div>
      <div class="dz-t1">上传知识文档</div>
      <div class="dz-t2">点击选择 或 拖拽文件到此处</div>
      <div class="dz-types">
        <span class="dz-type">PDF</span><span class="dz-type">DOCX</span>
        <span class="dz-type">Excel</span><span class="dz-type">TXT</span>
      </div>
    </div>
    <input type="file" id="fileInput" multiple accept=".pdf,.txt,.docx,.xlsx,.xls,.md" style="display:none">
    <div class="up-list" id="upList"></div>
    <div class="side-foot">
      <div>🔒 已启用 API 鉴权</div>
      <div>⏱ 限流 20 次/分钟 · 语义缓存</div>
    </div>
  </aside>

  <!-- 主聊天区 -->
  <main class="main">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatBox">
        <div class="welcome" id="welcome">
          <div class="orb">🤖</div>
          <h2>你好，我是知识库助手</h2>
          <p>可以问我关于制度、报销、假期等问题，也可以上传文档扩展知识库</p>
          <div class="chips">
            <button class="chip">公积金缴纳比例是多少？</button>
            <button class="chip">高铁出差的报销标准是什么？</button>
            <button class="chip">年假需要提前几天申请？</button>
            <button class="chip">通讯费报销标准是什么？</button>
          </div>
        </div>
      </div>
    </div>
    <div class="composer-wrap">
      <div class="composer-inner">
        <div class="composer">
          <button class="icon-btn" id="attachBtn" title="上传文档">📎</button>
          <textarea id="input" rows="1" placeholder="输入你的问题…（Enter 发送）"></textarea>
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
        <div class="composer-hint">内容由 AI 生成，请以知识库为准 · Enter 发送 / Shift+Enter 换行</div>
      </div>
    </div>
  </main>
</div>

<script>
const userId = localStorage.getItem('web_user_id') || ('web-' + Math.random().toString(36).slice(2, 10));
localStorage.setItem('web_user_id', userId);

const API_KEY = localStorage.getItem('rag_api_key') || '';
function apiHeaders(withJson) {
  const h = withJson ? { 'Content-Type': 'application/json' } : {};
  if (API_KEY) h['X-API-Key'] = API_KEY;
  return h;
}
function handle401() {
  const k = prompt('需要 API 密钥（部署时配置），请输入：');
  if (k) { localStorage.setItem('rag_api_key', k); location.reload(); }
}

const $ = id => document.getElementById(id);
const chatBox = $('chatBox'), input = $('input'), upList = $('upList'), chatScroll = $('chatScroll');
let sending = false;

/* 快捷问题 */
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  input.value = c.textContent.trim();
  input.focus();
  sendMessage();
}));

/* 后端状态 */
fetch('/health').then(r => r.json()).then(() => {
  $('healthDot').className = 'dot on'; $('healthText').textContent = '已连接';
}).catch(() => {
  $('healthDot').className = 'dot off'; $('healthText').textContent = '未连接';
});
fetch('/api/rag/agent/tools', { headers: apiHeaders(true) }).then(r => {
  if (r.status === 401) { handle401(); return null; }
  return r.json();
}).then(j => {
  if (j && j.total) $('toolsText').textContent = j.total + ' 个工具';
}).catch(() => { $('toolsText').textContent = '不可用'; });

/* 聊天 */
function scrollBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }
function addMsg(role, text) {
  const w = $('welcome'); if (w) w.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const av = document.createElement('div'); av.className = 'avatar'; av.textContent = role === 'user' ? '🙂' : '🤖';
  const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
  row.appendChild(av); row.appendChild(bubble);
  chatBox.appendChild(row);
  scrollBottom();
  return bubble;
}
async function sendMessage() {
  const text = input.value.trim();
  if (!text || sending) return;
  addMsg('user', text);
  input.value = '';
  const bubble = addMsg('ai', '');
  const caret = document.createElement('span'); caret.className = 'caret';
  bubble.appendChild(caret);
  sending = true; $('sendBtn').disabled = true;
  try {
    const resp = await fetch('/api/rag/chat/stream', {
      method: 'POST',
      headers: apiHeaders(true),
      body: JSON.stringify({ messages: [{ role: 'user', content: text }], user_id: userId, stream: true })
    });
    if (resp.status === 401) { handle401(); return; }
    if (!resp.ok) {
      let msg = '请求失败（' + resp.status + '）';
      try { const j = await resp.json(); if (j.detail) msg = j.detail; } catch (e) {}
      bubble.textContent = '⚠️ ' + msg;
      return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '', gotAny = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6); if (!raw) continue;
        let data; try { data = JSON.parse(raw); } catch (e) { continue; }
        if (data.type === 'chunk') { gotAny = true; full += data.data; bubble.textContent = full; scrollBottom(); }
        else if (data.type === 'error') { gotAny = true; bubble.textContent = full + '\n⚠️ ' + data.message; scrollBottom(); }
        else if (data.type === 'done') { break; }
      }
    }
    if (!full && !gotAny) bubble.textContent = '⚠️ 没有收到回复';
  } catch (e) {
    bubble.textContent = '⚠️ 连接失败：' + e.message;
  } finally {
    sending = false; $('sendBtn').disabled = false;
    scrollBottom();
  }
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* 上传 */
const drop = $('drop'), fileInput = $('fileInput'), attachBtn = $('attachBtn');
drop.addEventListener('click', () => fileInput.click());
attachBtn.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); uploadFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => { uploadFiles(fileInput.files); fileInput.value = ''; });

function addUpItem(name, text, cls) {
  const item = document.createElement('div');
  item.className = 'up-item';
  const fi = document.createElement('div'); fi.className = 'up-file-icon'; fi.textContent = '📄';
  const body = document.createElement('div'); body.className = 'up-body';
  const fn = document.createElement('div'); fn.className = 'up-name'; fn.textContent = name;
  const st = document.createElement('div'); st.className = 'up-st ' + cls; st.textContent = text;
  body.appendChild(fn); body.appendChild(st);
  item.appendChild(fi); item.appendChild(body);
  upList.prepend(item);
  return st;
}
async function uploadFiles(files) {
  for (const f of files) {
    const st = addUpItem(f.name, '上传中…', 'st-busy');
    st.innerHTML = '<span class="spinner"></span> 上传中…';
    const fd = new FormData();
    fd.append('file', f);
    try {
      const resp = await fetch('/api/rag/upload', { method: 'POST', headers: apiHeaders(false), body: fd });
      if (resp.status === 401) { handle401(); return; }
      const j = await resp.json().catch(() => ({}));
      if (!resp.ok) { st.innerHTML = '❌ ' + (j.detail || resp.status); st.className = 'up-st st-err'; continue; }
      st.innerHTML = '<span class="spinner"></span> ' + (j.message || '后台处理中…');
      pollStatus(j.task_id, st);
    } catch (e) { st.innerHTML = '❌ 上传失败：' + e.message; st.className = 'up-st st-err'; }
  }
}
async function pollStatus(taskId, el, tries) {
  tries = tries || 0;
  try {
    const resp = await fetch('/api/rag/upload/' + taskId + '/status', { headers: apiHeaders(false) });
    const j = await resp.json();
    if (j.status === 'SUCCESS') { el.innerHTML = '✅ 已入库'; el.className = 'up-st st-ok'; }
    else if (j.status === 'FAILURE') { el.innerHTML = '❌ ' + (j.error || '入库失败'); el.className = 'up-st st-err'; }
    else if (tries < 90) { setTimeout(() => pollStatus(taskId, el, tries + 1), 2000); }
    else { el.innerHTML = '⏳ 处理中…'; }
  } catch (e) { setTimeout(() => pollStatus(taskId, el, tries + 1), 3000); }
}
</script>
</body>
</html>
